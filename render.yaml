services:
  - type: web
    name: lacocha-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /salud
    envVars:
      # Filled in by hand in the Render dashboard (sync: false) so a push does not overwrite them
      - key: DATABASE_URL
        sync: false
      - key: API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
