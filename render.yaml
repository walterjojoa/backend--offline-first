services:
  - type: web
    name: lacocha-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /salud
    envVars:
      # Filled in by hand in the Render dashboard (sync: false) so a push does not overwrite them
      - key: DATABASE_URL
        sync: false
      # Render creates a long random key once; the app and the web panel copy it from the dashboard
      - key: API_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      # Documentos que entran como productor, separados por coma. Sin esto lo es quien se registre
      # primero, y si se adelanta otra persona la finca queda sin quien la administre
      - key: PRODUCER_DOCUMENTS
        sync: false
      # --- el servicio de IA ---
      # La direccion se pega a mano desde el panel, con la URL que Render le da al servicio de
      # abajo (https://lacocha-ia.onrender.com). Si queda vacia, el backend no llama a la IA y
      # sigue funcionando con el sistema experto: la IA agrega, no sostiene.
      - key: IA_URL
        sync: false
      # La clave la genera Render una vez en el servicio de IA y se copia sola aqui
      - key: IA_API_KEY
        fromService:
          name: lacocha-ia
          type: web
          envVarKey: API_KEY

  # El analisis que el backend no puede hacer con umbrales: anomalias en el agua y proyeccion del
  # lote. Vive aparte porque esta en Python, y porque asi se puede reiniciar o quedarse dormido sin
  # tumbar el registro en campo, que es lo que no se puede perder.
  - type: web
    name: lacocha-ia
    runtime: docker
    plan: free
    rootDir: servicio-ia
    dockerfilePath: ./Dockerfile
    healthCheckPath: /salud
    envVars:
      # Solo lo llama el backend, nunca el navegador, asi que la clave alcanza como puerta
      - key: API_KEY
        generateValue: true
