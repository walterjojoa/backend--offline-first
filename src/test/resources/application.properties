lacocha.database-url=jdbc:h2:mem:pruebas;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
lacocha.api-key=clave-prueba
lacocha.allowed-origins=http://localhost:5173
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.time-zone=UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.locations=classpath:db/migration,classpath:db/motor/{vendor}
