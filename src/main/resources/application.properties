spring.application.name=lacocha-backend
server.port=${PORT:8080}
server.error.include-message=always

# En Render: la cadena de conexion de Neon (postgresql://...). Para desarrollo ver application-local.properties
lacocha.database-url=${DATABASE_URL:}
# Clave que envian la app y los nodos en el encabezado X-API-Key
lacocha.api-key=${API_KEY:}
# Origenes permitidos para el panel web, separados por coma
lacocha.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jackson.property-naming-strategy=SNAKE_CASE
springdoc.swagger-ui.path=/docs

# Comprimir respuestas JSON grandes: ahorra datos cuando el celular tiene poca señal
server.compression.enabled=true
server.compression.mime-types=application/json
server.compression.min-response-size=1KB
