spring.application.name=lacocha-backend
server.port=${PORT:8080}
server.error.include-message=always

# On Render: the Neon connection string (postgresql://...). For development see application-local.properties
lacocha.database-url=${DATABASE_URL:}
# Key sent by the app and the nodes in the X-API-Key header
lacocha.api-key=${API_KEY:}
# Allowed origins for the web panel, comma separated
lacocha.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}

# Shared migrations live in db/migration; the ones that depend on the engine (partial indexes,
# for example) live in db/motor/postgresql or db/motor/h2. They come from the base-de-datos repo.
spring.flyway.locations=classpath:db/migration,classpath:db/motor/{vendor}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jackson.property-naming-strategy=SNAKE_CASE
springdoc.swagger-ui.path=/docs

# Compress large JSON responses: saves data when the phone has weak signal
server.compression.enabled=true
server.compression.mime-types=application/json
server.compression.min-response-size=1KB

# All dates in UTC, whatever the server time zone
spring.jackson.time-zone=UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.baseline-on-migrate=true
